research:
  backbone_protocol: "Frozen UniTS R1; normal-dictionary symbolic novelty fused with reconstruction score"
  fusion_mode: symbolic_novelty_fusion
  fast_mode: false
  anomaly_threshold_protocol: oracle_test_best_f1
  vus_max_buffer: 512
experiment:
  name: units_anomaly_r1_symbolic_novelty
  phase: 10
  regime: R1
  seed: 0
  variants: [fastshapelets, bossst]
  cells:
    - {task: anomaly, dataset: 1sddb40}
    - {task: anomaly, dataset: CIMIS44AirTemperature3}
    - {task: anomaly, dataset: ECG2}
    - {task: anomaly, dataset: PowerDemand1}
    - {task: anomaly, dataset: MSL}
    - {task: anomaly, dataset: SMAP}
    - {task: anomaly, dataset: PSM}
    - task: anomaly
      dataset: SMD
      data:
        smd_machines:
          [machine-1-1, machine-1-2, machine-1-3, machine-1-4, machine-1-5, machine-1-6, machine-1-7, machine-1-8,
           machine-2-1, machine-2-2, machine-2-3, machine-2-4, machine-2-5, machine-2-6, machine-2-7, machine-2-8, machine-2-9,
           machine-3-1, machine-3-2, machine-3-3, machine-3-4, machine-3-5, machine-3-6, machine-3-7, machine-3-8, machine-3-9, machine-3-10, machine-3-11]
model:
  backbone: units
  name: units_x128_pretrain
  repo_dir: third_party/UniTS
  checkpoint: REQUIRED_SET_BY_RUNNER
  seq_len: 96
data:
  anomaly: {val_fraction: 0.1, train_stride: 96}
# Test labels are never used to fit, normalise, choose the window or weight any score.
# window: auto -> univariate: dominant period of the normal training prefix (one cycle,
# the standard discord choice; ECG2 was the development dataset for this rule);
# multivariate: 24, the setting used in all earlier phases.
novelty:
  window: auto
  window_multivariate: 24
  period_bounds: [16, 256]
  period_min_acf: 0.3
  normalizer_holdout: 0.1    # vocabulary on the first 90% of each normal series, normaliser on the last 10%
  word_len: 8
  alphabet_size: 4
  step: 1
  distance_weight: 4.0
  flat_std: 1.0e-3
  max_fit_windows: 200000
  scale_floor: 0.5
  channel_top_k: null        # null -> ceil(sqrt(C))
  max_nearest_vocab: 2048    # nearest-normal-word search over the most frequent normal words
  lambda: 1.0
  lambda_sensitivity: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]
  events_per_entity: 3
  n_examples: 6
train:
  epochs: 10
  batch_size: 32
  lr_head: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  ckpt_every_steps: 100
  early_stop_patience: 3
  select_on: val_loss
  cache_backbone_features: false
eval: {batch_size: 64}
