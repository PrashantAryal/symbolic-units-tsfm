[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symtsfm"
version = "0.1.0"
description = "Symbolic words (SAX/SFA) as pattern-level evidence for a frozen time-series foundation model"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: needs network / pretrained checkpoints"]
